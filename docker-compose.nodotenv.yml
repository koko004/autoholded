services:
  fichador:
    image: koko004/autoholded:v1.4.3
    container_name: fichador-holded
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/fichador.db
      - TZ=Europe/Madrid
      - HEADLESS=false
      - DISPLAY=:99
      - HOLDED_EMAIL=tu@email.com
      - HOLDED_PASSWORD=tu_contraseña
      - TELEGRAM_BOT_TOKEN=123456:ABC-DEF
      - TELEGRAM_CHAT_ID=-1001234567890
      - TELEGRAM_ENABLED=false
    shm_size: '2gb'
