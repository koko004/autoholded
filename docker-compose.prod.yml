services:
  fichador:
    image: koko004/autoholded:v1.4.2
    container_name: fichador-holded
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/fichador.db
      - TZ=Europe/Madrid
      - HEADLESS=false
      - DISPLAY=:99
    env_file:
      - .env
    shm_size: '2gb'
